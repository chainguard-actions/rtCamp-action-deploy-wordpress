name: Test VAULT_ADDR + VAULT_TOKEN satisfy secret check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom addon.sh
        run: |
          rm -f "$GITHUB_WORKSPACE/vault-marker.txt"
          mkdir -p "$GITHUB_WORKSPACE/.github/deploy"
          cat > "$GITHUB_WORKSPACE/.github/deploy/addon.sh" <<'EOF'
          #!/usr/bin/env bash
          echo "VAULT_ADDR=${VAULT_ADDR}" > "$GITHUB_WORKSPACE/vault-marker.txt"
          EOF
          chmod +x "$GITHUB_WORKSPACE/.github/deploy/addon.sh"
      - id: action
        uses: .
        env:
          VAULT_ADDR: https://vault.example.invalid
          VAULT_TOKEN: dummy-vault-token
      - name: Assert addon ran with vault config
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/vault-marker.txt" ]; then
            echo "FAIL: marker not found"
            exit 1
          fi
          cat "$GITHUB_WORKSPACE/vault-marker.txt"
          grep -q '^VAULT_ADDR=https://vault.example.invalid$' "$GITHUB_WORKSPACE/vault-marker.txt" || { echo "FAIL: VAULT_ADDR mismatch"; exit 1; }
          echo "PASS"
      - name: Cleanup
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/.github/deploy" "$GITHUB_WORKSPACE/vault-marker.txt" || true
