name: Test branch deletion skip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake event payload with deleted=true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github"
          echo '{"deleted": true, "ref": "refs/heads/feature-branch"}' > /tmp/event.json
      - name: Run action with branch deletion event
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/heads/feature-branch
          GITHUB_EVENT_NAME: delete
          GITHUB_EVENT_PATH: /tmp/event.json
          SSH_PRIVATE_KEY: dummy-key-to-pass-entrypoint-check
      - name: Assert action exited (branch deletion detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action exits with code 78 (neutral) on branch deletion,
          # which act may surface as failure or success depending on version.
          # Either way, the action should not have deployed anything.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action handled branch deletion event (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
