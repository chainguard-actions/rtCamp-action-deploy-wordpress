name: Test branch not in hosts.yml skips deployment (non-zero exit)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create hosts.yml without the current branch
        run: |
          rm -rf "$GITHUB_WORKSPACE/.github/deploy"
          cat > "$GITHUB_WORKSPACE/.github/hosts.yml" <<'EOF'
          some-nonexistent-branch-xyz:
            hostname: example.invalid
            user: deploy
            deploy_path: /var/www/example
          EOF
      - id: action
        uses: .
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: dummy-key-not-used
      - name: Assert action exited non-zero (no matching branch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected non-zero exit (78) when branch is not in hosts.yml"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/.github/hosts.yml" || true
