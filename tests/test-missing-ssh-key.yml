name: Test missing SSH key error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without SSH_PRIVATE_KEY (expect failure)
        id: action
        uses: .
        continue-on-error: true
        # No SSH_PRIVATE_KEY, VAULT_ADDR, or VAULT_TOKEN set — action should exit 1

      - name: Assert action failed due to missing credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when SSH_PRIVATE_KEY is missing, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when SSH_PRIVATE_KEY was not provided"
