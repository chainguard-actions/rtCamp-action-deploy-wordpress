name: Test missing SSH key validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without SSH_PRIVATE_KEY (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/heads/main
          # SSH_PRIVATE_KEY intentionally omitted to trigger validation error
          # VAULT_ADDR and VAULT_TOKEN also omitted

      - name: Assert action failed due to missing SSH key
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when SSH_PRIVATE_KEY is missing, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when SSH_PRIVATE_KEY was not provided"
