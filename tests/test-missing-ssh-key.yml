name: Test missing SSH key error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without SSH_PRIVATE_KEY (expect failure)
        id: action
        uses: .
        continue-on-error: true
        # No SSH_PRIVATE_KEY, VAULT_ADDR, or VAULT_TOKEN set — action should exit 1

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SSH_PRIVATE_KEY is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when SSH_PRIVATE_KEY is missing"
