name: Test missing SSH key error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action without SSH_PRIVATE_KEY or Vault credentials.
      # The entrypoint.sh should detect the missing secret and exit 1.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/heads/main

      - name: Assert action failed due to missing SSH key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SSH_PRIVATE_KEY is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when SSH_PRIVATE_KEY was not provided"
