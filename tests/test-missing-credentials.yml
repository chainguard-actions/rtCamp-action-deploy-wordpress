name: Test missing credentials behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          # Provide minimal env vars; no real SSH key or server — action should fail
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main

      - name: Assert action failed as expected (no credentials provided)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no credentials were provided"
