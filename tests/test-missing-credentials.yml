name: Test missing credentials fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action without credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          # Provide clearly invalid/empty values so the action fails at
          # credential validation rather than hanging on a real connection.
          SSH_PRIVATE_KEY: ""
          REMOTE_HOST: "invalid.example.invalid"
          REMOTE_USER: "testuser"
          REMOTE_PATH: "/var/www/html"

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when credentials are missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when credentials were missing"
