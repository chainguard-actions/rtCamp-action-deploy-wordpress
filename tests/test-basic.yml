name: Test basic usage - Deploy WordPress (graceful failure without credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        env:
          # Minimal env vars the action may read; no real SSH key or server
          SSH_PRIVATE_KEY: ""
          REMOTE_HOST: "127.0.0.1"
          REMOTE_USER: "deploy"
          REMOTE_PATH: "/var/www/html"
          WP_VERSION: "latest"

      - name: Assert action ran and failed gracefully (no credentials available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (no credentials — acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no SSH credentials or real server)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
