name: Test missing configuration error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action and expect failure due to missing config
        id: action
        uses: .
        continue-on-error: true
        env:
          # Simulate a push event context
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: push
          # No SSH keys, host, or WordPress config provided — action should fail

      - name: Assert action failed due to missing configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no server configuration is provided, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required configuration is missing"
