name: Test partial vault config error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with only VAULT_ADDR set (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          # Only VAULT_ADDR is set, VAULT_TOKEN is missing — should still fail
          # because SSH_PRIVATE_KEY is also missing and vault config is incomplete
          VAULT_ADDR: https://vault.example.com:8200

      - name: Assert action failed due to incomplete credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when only VAULT_ADDR is set without VAULT_TOKEN or SSH_PRIVATE_KEY, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when vault config was incomplete and SSH_PRIVATE_KEY was missing"
