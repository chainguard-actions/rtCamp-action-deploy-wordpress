name: Test partial Vault config error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with only VAULT_ADDR set (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          # Only VAULT_ADDR set, no VAULT_TOKEN and no SSH_PRIVATE_KEY
          # entrypoint.sh sets missing_secret to "VAULT_ADDR and/or VAULT_TOKEN" and exits 1
          VAULT_ADDR: https://vault.example.com

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with partial Vault config, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with partial Vault config (only VAULT_ADDR set)"
