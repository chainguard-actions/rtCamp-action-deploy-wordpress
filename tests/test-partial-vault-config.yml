name: Test partial vault config (VAULT_ADDR only) fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          VAULT_ADDR: https://vault.example.invalid
      - name: Assert action failed due to missing VAULT_TOKEN
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when only VAULT_ADDR is set"
            exit 1
          fi
          echo "PASS"
