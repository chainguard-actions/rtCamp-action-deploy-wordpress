name: Test partial Vault credentials rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When only VAULT_ADDR is set (but not VAULT_TOKEN), the entrypoint.sh
      # sets missing_secret to "VAULT_ADDR and/or VAULT_TOKEN" and exits 1.
      # This verifies the partial-vault-credentials error path is triggered.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/heads/main
          VAULT_ADDR: http://127.0.0.1:8200

      - name: Assert action failed due to incomplete Vault credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when only VAULT_ADDR is set (VAULT_TOKEN missing), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when only VAULT_ADDR was provided without VAULT_TOKEN"
